<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="25%" stop-color="#22c55e" />
      <stop offset="70%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <linearGradient id="pipeCapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="30%" stop-color="#4ade80" />
      <stop offset="75%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>

    <radialGradient id="birdAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Cyber/Arcade Grid Overlay -->
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="300" fill="#3b82f6" fill-opacity="0.08" filter="url(#glowFilter)" />
  <circle cx="1000" cy="300" r="350" fill="#eab308" fill-opacity="0.1" filter="url(#glowFilter)" />
  <circle cx="600" cy="550" r="250" fill="#8b5cf6" fill-opacity="0.06" filter="url(#glowFilter)" />

  <!-- Decorative Arcade Background Pipes (Left & Right) -->
  <g opacity="0.35">
    <!-- Left Top Pipe -->
    <rect x="60" y="-20" width="70" height="180" fill="url(#pipeGrad)" rx="4" />
    <rect x="54" y="140" width="82" height="30" fill="url(#pipeCapGrad)" rx="6" />
    <!-- Left Bottom Pipe -->
    <rect x="60" y="380" width="70" height="270" fill="url(#pipeGrad)" rx="4" />
    <rect x="54" y="350" width="82" height="30" fill="url(#pipeCapGrad)" rx="6" />
    <!-- Right Top Pipe -->
    <rect x="1070" y="-20" width="70" height="240" fill="url(#pipeGrad)" rx="4" />
    <rect x="1064" y="200" width="82" height="30" fill="url(#pipeCapGrad)" rx="6" />
    <!-- Right Bottom Pipe -->
    <rect x="1070" y="440" width="70" height="210" fill="url(#pipeGrad)" rx="4" />
    <rect x="1064" y="410" width="82" height="30" fill="url(#pipeCapGrad)" rx="6" />
  </g>

  <!-- Ground Strip at Bottom -->
  <g>
    <rect x="0" y="606" width="1200" height="24" fill="#334155" />
    <rect x="0" y="606" width="1200" height="4" fill="#22c55e" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(140, 0)">
    <!-- Top Arcade Pill Badge -->
    <g transform="translate(0, 105)">
      <rect width="250" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
      <circle cx="20" cy="18" r="5" fill="#22c55e" filter="url(#glowFilter)" />
      <text x="36" y="23" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">RETRO ARCADE GAME</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 205)">
      <text x="0" y="0" fill="url(#goldText)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="-1" filter="url(#shadow)">
        FLAPPY BIRD
      </text>
      <text x="440" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="-1" filter="url(#shadow)">
        ARCADE
      </text>
    </g>

    <!-- Subtitle / Description -->
    <g transform="translate(0, 260)">
      <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400">
        Custom physics-based arcade game with responsive controls,
      </text>
      <text x="0" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400">
        dynamic themes, custom skins &amp; smooth 60 FPS gameplay.
      </text>
    </g>

    <!-- Feature Pills -->
    <g transform="translate(0, 360)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="94" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="47" y="21" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">REACT</text>

      <!-- Tag 2 -->
      <rect x="106" y="0" width="132" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="172" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">TYPESCRIPT</text>

      <!-- Tag 3 -->
      <rect x="250" y="0" width="156" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="328" y="21" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">HTML5 CANVAS</text>

      <!-- Tag 4 -->
      <rect x="418" y="0" width="154" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="495" y="21" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">CUSTOM PHYSICS</text>
    </g>

    <!-- Divider Line -->
    <line x1="0" y1="440" x2="570" y2="440" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Creator & Domain Footer -->
    <g transform="translate(0, 485)">
      <!-- Creator Avatar circle -->
      <circle cx="20" cy="20" r="20" fill="#3b82f6" />
      <text x="20" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" text-anchor="middle">D</text>

      <!-- Creator Text -->
      <text x="52" y="16" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">Built by Dushyant Singh</text>
      <text x="52" y="36" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">https://flappy-dushyant.vercel.app/</text>
    </g>
  </g>

  <!-- Right Visual Mascot Hero (Pixel Flappy Bird in Glow Pod) -->
  <g transform="translate(860, 270)">
    <!-- Glow Aura -->
    <circle cx="0" cy="0" r="220" fill="url(#birdAura)" />

    <!-- Floating Badge Frame -->
    <rect x="-140" y="-140" width="280" height="280" rx="36" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" filter="url(#shadow)" />
    <rect x="-132" y="-132" width="264" height="264" rx="28" fill="#1e293b" fill-opacity="0.5" stroke="#facc15" stroke-width="1" stroke-opacity="0.3" />

    <!-- Pixel Mascot (Scale: 14x per pixel block) -->
    <!-- Bird Grid 12x10, offset centered at -84, -70 -->
    <g transform="translate(-84, -70)">
      <!-- Outline / Deep Slate (#020617) -->
      <rect x="42" y="0" width="56" height="14" fill="#020617" />
      <rect x="28" y="14" width="14" height="14" fill="#020617" />
      <rect x="98" y="14" width="28" height="14" fill="#020617" />
      <rect x="14" y="28" width="14" height="14" fill="#020617" />
      <rect x="126" y="28" width="14" height="28" fill="#020617" />
      <rect x="0" y="42" width="14" height="56" fill="#020617" />
      <rect x="154" y="56" width="14" height="42" fill="#020617" />
      <rect x="98" y="56" width="14" height="28" fill="#020617" />
      <rect x="112" y="98" width="42" height="14" fill="#020617" />
      <rect x="84" y="98" width="28" height="14" fill="#020617" />
      <rect x="14" y="98" width="14" height="14" fill="#020617" />
      <rect x="28" y="112" width="14" height="14" fill="#020617" />
      <rect x="42" y="126" width="56" height="14" fill="#020617" />
      <rect x="98" y="112" width="14" height="14" fill="#020617" />

      <!-- Yellow / Amber Body -->
      <rect x="42" y="14" width="56" height="14" fill="#fde047" />
      <rect x="28" y="28" width="56" height="14" fill="#facc15" />
      <rect x="14" y="42" width="70" height="14" fill="#facc15" />
      <rect x="14" y="56" width="84" height="14" fill="#facc15" />
      <rect x="56" y="70" width="42" height="14" fill="#f59e0b" />
      <rect x="56" y="84" width="28" height="14" fill="#f59e0b" />
      <rect x="28" y="98" width="56" height="14" fill="#d97706" />
      <rect x="42" y="112" width="56" height="14" fill="#b45309" />

      <!-- Eye White & Pupil -->
      <rect x="84" y="28" width="42" height="28" fill="#ffffff" />
      <rect x="98" y="42" width="14" height="14" fill="#020617" />

      <!-- Wing -->
      <rect x="14" y="70" width="42" height="14" fill="#ffffff" />
      <rect x="14" y="84" width="42" height="14" fill="#fef08a" />

      <!-- Beak Orange -->
      <rect x="112" y="56" width="42" height="14" fill="#fb923c" />
      <rect x="112" y="70" width="42" height="14" fill="#f97316" />
      <rect x="112" y="84" width="42" height="14" fill="#ea580c" />
      <rect x="98" y="84" width="14" height="14" fill="#ea580c" />
    </g>

    <!-- Floating arcade stars/particles -->
    <polygon points="120,-90 124,-80 134,-76 124,-72 120,-62 116,-72 106,-76 116,-80" fill="#facc15" filter="url(#glowFilter)" />
    <polygon points="-110,80 -107,87 -100,90 -107,93 -110,100 -113,93 -120,90 -113,87" fill="#38bdf8" filter="url(#glowFilter)" />
    <polygon points="110,100 113,106 120,108 113,110 110,116 107,110 100,108 107,106" fill="#4ade80" filter="url(#glowFilter)" />
  </g>
</svg>
